name: Release

on:
  push:
    branches:
      - main

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Compute release version
        id: version
        run: |
          # produce something like v0.0.0-20250430T080501
          VERSION="v0.0.0-$(date +'%Y%m%dT%H%M%S')"
          echo "GORELEASER_CURRENT_TAG=$VERSION" >> $GITHUB_ENV

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # override GoReleaser’s tag so it parses as valid semver
          GORELEASER_CURRENT_TAG: ${{ env.GORELEASER_CURRENT_TAG }}
